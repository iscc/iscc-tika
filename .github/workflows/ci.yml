---
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint (fmt, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format check (core)
        run: cargo fmt --manifest-path iscc-tika-core/Cargo.toml --check
      - name: Rust format check (python bindings)
        run: cargo fmt --manifest-path bindings/iscc-tika-python/Cargo.toml --check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Ruff check
        run: pipx run ruff check bindings/iscc-tika-python/
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # .cargo/config.toml links with clang + mold, matching local builds.
      - name: Install linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: iscc-tika-core -> target
      # build.rs obtains libtika_native via setup_tika_native.py (Gradle native
      # image). There is no published prebuilt library; cache the one this job
      # builds so the next run reuses it. cargo test puts that libs directory
      # on LD_LIBRARY_PATH. #[ignore] OCR tests stay skipped.
      - uses: actions/cache@v4
        id: tika-native
        with:
          path: |
            iscc-tika-core/target/debug/build/iscc-tika-*/out/libs
            iscc-tika-core/target/debug/build/iscc-tika-*/out/tika-native
          key: tika-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iscc-tika-core/tika-native/**', 'iscc-tika-core/setup_tika_native.py', 'iscc-tika-core/build.rs') }}
      - name: Reuse cached native library
        if: steps.tika-native.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(iscc-tika-core/target/debug/build/iscc-tika-*/out/tika-native)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "native-library cache hit did not restore a tika-native directory"
            exit 1
          fi
          # Checkout mtimes are newer than the cached copy, which would make
          # setup_tika_native.py rebuild. Touch the copy so an unchanged image
          # is kept.
          find "${dirs[@]}" -type f -exec touch {} +
      - name: cargo test
        run: cargo test --manifest-path iscc-tika-core/Cargo.toml
  build-test-wheel:
    name: Build test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --manifest-path bindings/iscc-tika-python/Cargo.toml
            --release --out bindings/iscc-tika-python/dist
            -i python3.10 --compatibility manylinux_2_28
          sccache: 'false'
          target: x86_64
          container: quay.io/pypa/manylinux_2_28_x86_64:latest
          before-script-linux: |
            yum install -y zip openssl-devel
            export PATH="/opt/python/cp310-cp310/bin:$PATH"
            > .cargo/config.toml
      - uses: actions/upload-artifact@v7
        with:
          name: test-wheel
          path: bindings/iscc-tika-python/dist
  python-test:
    name: Python ${{ matrix.python-version }} test
    needs: build-test-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          name: test-wheel
          path: bindings/iscc-tika-python/dist
      - name: Install and test
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install iscc-tika --find-links bindings/iscc-tika-python/dist --no-index --force-reinstall
          pip install pytest pytest-timeout scikit-learn lxml
          cd bindings/iscc-tika-python
          pytest -s
  python:
    name: Python tests
    if: always()
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Python versions passed
        run: test "${{ needs.python-test.result }}" = "success"
